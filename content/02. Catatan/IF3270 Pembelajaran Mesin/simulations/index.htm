<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulasi Interaktif ML — RNN · LSTM · Attention · Transformer · RL</title>
    <meta
      name="description"
      content="Simulasi interaktif IF3270: diagram & alur penghitungan RNN, LSTM, Attention (Bahdanau/Luong), Transformer, dan Reinforcement Learning."
    />

    <!-- KaTeX (CDN). Bila gagal load, math-render.js otomatis fallback ke HTML/CSS. -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css"
      crossorigin="anonymous"
    />
    <script
      defer
      src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"
      crossorigin="anonymous"
      onerror="window.__KATEX_FAILED=true"
    ></script>

    <!-- Tipografi: Bricolage Grotesque (display) · Lexend (body, reading-optimized) · JetBrains Mono.
         Bila offline, font stack jatuh ke system-ui dengan anggun. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Lexend:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <!-- definisi marker panah global (dipakai semua diagram SVG) -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <marker id="arrowBlue" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L7,3 L0,6 Z" fill="#3b82f6" />
        </marker>
        <marker id="arrowGray" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
          <path d="M0,0 L7,3 L0,6 Z" fill="currentColor" />
        </marker>
      </defs>
    </svg>

    <header class="app-bar">
      <div class="app-bar-inner">
        <a class="brand" href="../" title="Kembali ke catatan IF3270">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 40 40" width="34" height="34">
              <circle cx="9" cy="11" r="4.2" />
              <circle cx="9" cy="29" r="4.2" />
              <circle cx="31" cy="20" r="5" class="mark-accent" />
              <path d="M12.5 12.5 L27 18 M12.5 27.5 L27 22" />
            </svg>
          </span>
          <span class="brand-text">
            <span class="brand-title">ML<span class="brand-dot">·</span>Lab</span>
            <span class="brand-sub">Pembelajaran Mesin Interaktif</span>
          </span>
        </a>
        <div class="app-bar-actions">
          <span class="course-chip">IF3270</span>
          <button id="theme-toggle" class="icon-btn" title="Ganti tema" aria-label="Ganti tema">🌙</button>
        </div>
      </div>
    </header>

    <h1 class="sr-only">Simulasi Interaktif Pembelajaran Mesin — IF3270</h1>

    <nav class="tabs" role="tablist" aria-label="Pilih topik">
      <div class="tabs-inner">
        <button class="tab active" data-tab="rnn" role="tab">RNN</button>
        <button class="tab" data-tab="lstm" role="tab">LSTM</button>
        <button class="tab" data-tab="attention" role="tab">Attention</button>
        <button class="tab" data-tab="transformer" role="tab">Transformer</button>
        <button class="tab" data-tab="rl" role="tab">Reinforcement Learning</button>
      </div>
    </nav>

    <main class="content">
      <section id="tab-rnn" class="tab-panel active">
        <div class="sim-root" id="rnn-root"></div>
      </section>
      <section id="tab-lstm" class="tab-panel">
        <div class="sim-root" id="lstm-root"></div>
      </section>
      <section id="tab-attention" class="tab-panel">
        <div class="sim-root" id="attention-root"></div>
      </section>
      <section id="tab-transformer" class="tab-panel">
        <div class="sim-root" id="transformer-root"></div>
      </section>
      <section id="tab-rl" class="tab-panel">
        <div class="sim-root" id="rl-root"></div>
      </section>
    </main>

    <footer class="app-footer">
      <span id="katex-status"></span>
      <span
        >Dibuat untuk catatan IF3270 Pembelajaran Mesin · semua perhitungan berjalan di browser
        kamu.</span
      >
    </footer>

    <!-- urutan penting: util & draw dulu, lalu simulator, lalu app -->
    <script src="js/matrix.js"></script>
    <script src="js/math-render.js"></script>
    <script src="js/draw.js"></script>
    <script src="js/stepper.js"></script>
    <script src="data/presets-loader.js"></script>
    <script src="js/rnn.js"></script>
    <script src="js/lstm.js"></script>
    <script src="js/attention.js"></script>
    <script src="js/transformer.js"></script>
    <script src="js/rl.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
